<!doctype html><meta charset="utf-8"><meta name="robots" content="noindex"><title>look</title>
<body style="font:12px monospace"><pre id="o">running…</pre><script>
/* ?u=layerurl&d=datefield&w=where  — fields, newest 4 records, timing */
var P=new URLSearchParams(location.search),o=document.getElementById('o'),L=[];function log(s){L.push(s);o.textContent=L.join('\n')}
function j(u){var t=Date.now();return fetch(u).then(function(r){return r.json()}).then(function(x){x._ms=Date.now()-t;return x})}
(async function(){
 var us=P.getAll('u');
 for(var i=0;i<us.length;i++){var u=us[i],d=P.getAll('d')[i]||'',w=P.getAll('w')[i]||'1=1';
  log('### '+u);
  try{var m=await j(u+'?f=json');log('fields: '+(m.fields||[]).filter(function(x){return fo==='*'||/sal|date|use|luc|dor/i.test(x.name)}).map(function(x){return x.name+':'+x.type.replace('esriFieldType','')}).join(' ')+' oid='+m.objectIdField);log('maxRecordCount '+m.maxRecordCount+' sup.orderBy '+(m.advancedQueryCapabilities&&m.advancedQueryCapabilities.supportsOrderBy)+' pagination '+(m.advancedQueryCapabilities&&m.advancedQueryCapabilities.supportsPagination)+' cap '+m.capabilities)}catch(e){log('meta fail '+e);continue}
  try{var q=new URLSearchParams({where:w,outFields:fo,returnGeometry:'false',resultRecordCount:'6',orderByFields:d?d+' DESC':'',f:'json'});
   var r=await j(u+'/query?'+q);log('newest ('+r._ms+' ms): '+(r.error?JSON.stringify(r.error):JSON.stringify((r.features||[]).map(function(f){return f.attributes}))))}catch(e){log('query fail '+e)}
  try{var g=new URLSearchParams({where:w,geometry:P.get('pt')||'',geometryType:'esriGeometryPoint',inSR:'4326',distance:'1',units:'esriSRUnit_StatuteMile',returnCountOnly:'true',f:'json'});if(P.get('pt')){var c=await j(u+'/query?'+g);log('count within 1 mi of pt ('+c._ms+' ms): '+JSON.stringify(c.count!=null?c.count:c.error))}}catch(e){log('geo fail '+e)}
 }
 if(P.get('stat')){var u0=us[0];var st=await j(u0+'/query?'+new URLSearchParams({where:P.get('sw')||'1=1',groupByFieldsForStatistics:P.get('stat'),outStatistics:JSON.stringify([{statisticType:'count',onStatisticField:P.get('stat'),outStatisticFieldName:'n'}]),f:'json'}));log('groups: '+JSON.stringify((st.features||[]).map(function(f){return f.attributes}))+(st.error?JSON.stringify(st.error):''))}
 log('DONE');
})();
</script>
