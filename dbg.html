<!doctype html><meta charset="utf-8"><title>dbg</title><pre id="o"></pre><iframe id="f" style="width:400px;height:300px"></iframe><script>
function log(s){document.getElementById('o').textContent+=s+'\n'}
var f=document.getElementById('f');f.src='index.html?t='+Date.now();
f.onload=function(){var W=f.contentWindow,D=W.CompsDebug,pt={lat:26.645079,lon:-81.870928};var t=performance.now();
  D.fetchCounty('Lee',pt).then(function(r){log('Lee direct: '+r.recs.length+' in '+((performance.now()-t)/1000).toFixed(1)+'s')},function(e){log('Lee direct ERR '+e.message)}).then(function(){
    var t2=performance.now();pt.county='Lee';D.runAt(pt);
    var iv=setInterval(function(){if(!D.S.busy){clearInterval(iv);log('runAt done '+((performance.now()-t2)/1000).toFixed(1)+'s sources='+JSON.stringify(D.S.sources)+' stateErr='+(D.S.stateErr&&D.S.stateErr.message)+' all='+D.S.all.length+' status='+W.document.getElementById('c-status').textContent);log('DONE')}},500);
  });
};
</script>
